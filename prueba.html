<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Paradas del Instituto Politecnico</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      #map {
        height: 500px;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <h1>Paradas del Instituto Politecnico</h1>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      const map = L.map("map").setView([-26.080175, -58.277211], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // Ícono para Hospital
      const hospitalIcon = L.icon({
        iconUrl: "http://localhost:3000/css/img/Hospital/Hospitales.png",
        iconSize: [64, 64],
        iconAnchor: [32, 64],
        popupAnchor: [0, -64],
      });

      // Ícono para Centro de Salud
      const centroDeSaludIcon = L.icon({
        iconUrl: "http://localhost:3000/css/img/Hospital/CentroDeSalud.png",
        iconSize: [64, 64],
        iconAnchor: [32, 64],
        popupAnchor: [0, -64],
      });
      const centroOdontologicoIcon = L.icon({
        iconUrl:
          "http://localhost:3000/css/img/Hospital/CentroOdontologico.png",
        iconSize: [64, 64],
        iconAnchor: [32, 64],
        popupAnchor: [0, -64],
      });

      const ColectivoLIcon = L.icon({
        iconUrl: "http://localhost:3000/css/img/Colectivos/ColectivoL.png",
        iconSize: [64, 64],
        iconAnchor: [32, 64],
        popupAnchor: [0, -64],
      });

      const ColectivoFIcon = L.icon({
        iconUrl: "http://localhost:3000/css/img/Colectivos/ColectivoF.png",
        iconSize: [64, 64],
        iconAnchor: [32, 64],
        popupAnchor: [0, -64],
      });

      fetch("http://localhost:3000/api/ubicaciones")
        .then((res) => res.json())
        .then((ubicaciones) => {
          ubicaciones.forEach((ubicacion) => {
            // Por defecto no usamos ningún ícono personalizado
            let icono = undefined;

            // Subcategoría 1 = Hospital
            if (Number(ubicacion.subcategoria_id) === 1) {
              icono = hospitalIcon;
            }

            // Subcategoría 2 = Centro de Salud
            if (Number(ubicacion.subcategoria_id) === 2) {
              icono = centroDeSaludIcon;
            }

            // Subcategoría 3 = Centro Odontológico
            if (Number(ubicacion.subcategoria_id) === 3) {
              icono = centroOdontologicoIcon;
            }

            // Subcategoría 4 = Colectivo Linea L
            if (Number(ubicacion.subcategoria_id) === 4) {
              icono = ColectivoLIcon;
            }

            // Subcategoría 5 = Colectivo Linea F
            if (Number(ubicacion.subcategoria_id) === 5) {
              icono = ColectivoFIcon;
            }

            L.marker([ubicacion.latitud, ubicacion.longitud], {
              icon: icono,
            })
              .addTo(map)
              .bindPopup(ubicacion.name);
          });
        })
        .catch((error) => {
          console.error("Error obteniendo ubicaciones:", error);
        });
    </script>
  </body>
</html>
